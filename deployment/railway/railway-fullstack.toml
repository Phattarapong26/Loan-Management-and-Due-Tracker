# Railway Full Stack Configuration
# ใช้ไฟล์นี้เป็น reference เท่านั้น
# Railway จะ detect backend/railway.toml และ frontend/railway.toml อัตโนมัติ

# ─── Backend Service ───────────────────────────────────────────────────────────
# Source: backend/
# Build: Dockerfile (backend/Dockerfile)
# Start: npx prisma migrate deploy && npm start
# Health: GET /health → {"status":"healthy"}
# Port: 3000 (Railway auto-assigns $PORT)

# ─── Frontend Service ──────────────────────────────────────────────────────────
# Source: frontend/
# Build: Dockerfile (frontend/Dockerfile) with VITE_API_URL build arg
# Start: serve -s dist -l $PORT
# Health: GET /
# Port: 5173 (Railway auto-assigns $PORT)

# ─── Required Services ─────────────────────────────────────────────────────────
# PostgreSQL: Railway plugin → DATABASE_URL auto-injected
# Redis:      Railway plugin → REDIS_URL auto-injected

# ─── Deploy Order ──────────────────────────────────────────────────────────────
# 1. Add PostgreSQL plugin
# 2. Add Redis plugin
# 3. Deploy Backend (set env vars)
# 4. Copy Backend URL → set VITE_API_URL in Frontend
# 5. Deploy Frontend
# 6. Copy Frontend URL → update CORS_ORIGIN and FRONTEND_URL in Backend
# 7. Redeploy Backend
