# nixpacks.toml — ใช้เฉพาะถ้า Railway ไม่ detect Dockerfile อัตโนมัติ
# แนะนำให้ใช้ Dockerfile แทน (backend/Dockerfile, frontend/Dockerfile)

[phases.setup]
nixPkgs = ["nodejs_20", "openssl"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npx prisma generate", "npm run build"]

[start]
cmd = "npx prisma migrate deploy && npm start"
